
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kannada-movie-radar"
version = "0.1.0"
description = "Agentic AI-powered Kannada cinema intelligence, discovery and availability platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Mounesh" }
]

keywords = [
    "kannada",
    "cinema",
    "agentic-ai",
    "movie-intelligence",
    "telegram",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "feedparser>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "google-genai>=1,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["radar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
