
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kannada-movie-radar"
version = "0.1.0"
description = "Agentic AI-powered Kannada cinema intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
