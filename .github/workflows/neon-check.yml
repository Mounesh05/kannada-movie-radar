
name: Neon Cloud Database Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-neon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Verify Neon connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from radar.database.connection import get_connection

          if not os.getenv("DATABASE_URL"):
              raise RuntimeError("DATABASE_URL is missing")

          with get_connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  print("Connected database:", cur.fetchone()[0])

                  cur.execute("""
                      SELECT COUNT(*)
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                        AND table_type = 'BASE TABLE'
                  """)
                  print("Cloud tables:", cur.fetchone()[0])

          print("PASS: GitHub Actions connected to Neon")
          PY
