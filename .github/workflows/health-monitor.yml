
name: Kannada Movie Radar Health Monitor

on:
  workflow_dispatch:
    inputs:
      send_alerts:
        description: "Send alerts to Telegram if issues are detected"
        type: boolean
        required: true
        default: false

  schedule:
    # Every day at 12:00 PM IST
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: kannada-movie-radar-health-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run database health monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          SEND_ALERTS: ${{ inputs.send_alerts }}
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Missing DATABASE_URL"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "schedule" ||
                "$SEND_ALERTS" == "true" ]]; then
            python -m radar.telegram.health_monitor --send
          else
            python -m radar.telegram.health_monitor
          fi

      - name: Notify Telegram if health check fails
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m radar.telegram.failure_alert --send
