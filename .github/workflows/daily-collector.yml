
name: Kannada Movie Radar Collector

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: "RSS feed URL approved for collection"
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run collection preview
        env:
          RSS_FEED: ${{ inputs.feed_url }}
        run: |
          python -m radar.collectors.pipeline \
            --feed "$RSS_FEED" \
            --dry-run
