
name: Kannada Movie Radar Sunday Digest

on:
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send Telegram message (unchecked = preview)"
        type: boolean
        required: true
        default: false

  schedule:
    # Sunday 09:00 IST = Sunday 03:30 UTC
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: kannada-movie-radar-sunday-digest
  cancel-in-progress: false

jobs:
  digest:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        vars.DIGEST_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run Sunday digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_NOW: ${{ inputs.send_now }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL is missing"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "schedule" ||
                "$SEND_NOW" == "true" ]]; then
            python -m radar.telegram.sunday_digest --send
          else
            python -m radar.telegram.sunday_digest
          fi
