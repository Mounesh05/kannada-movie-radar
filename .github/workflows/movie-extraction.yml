
name: Kannada Movie Radar - Movie Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$GEMINI_API_KEY"

      - name: Preview pending candidates
        run: |
          python -m radar.collectors.process_movie_candidates \
            --limit 8

      - name: Extract up to two new candidates
        run: |
          python -m radar.collectors.process_movie_candidates \
            --limit 2 --execute
